<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petropolis — Dev Board</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --tan:       #f5ede0;
    --tan-deep:  #ecdcca;
    --tan-card:  #fdf8f2;
    --tan-border:#ddc9b0;
    --ink:       #3d2c1e;
    --ink-soft:  #7a5c44;
    --ink-muted: #a8876a;

    /* pet city accent palette */
    --coral:  #f4724a;
    --sky:    #4ab8e8;
    --mint:   #52c98a;
    --lemon:  #f5c842;
    --lavender:#b07fe8;
    --rose:   #f472b6;

    --high:   var(--coral);
    --med:    var(--lemon);
    --low:    var(--mint);

    --radius: 14px;
    --shadow: 0 4px 18px rgba(61,44,30,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--tan);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 80px;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(74,184,232,0.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(176,127,232,0.08) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(82,201,138,0.05) 0%, transparent 60%);
  }

  /* ── PAWS / DECO ── */
  body::before {
    content: '🐾';
    position: fixed;
    bottom: 20px; right: 24px;
    font-size: 2.2rem;
    opacity: .12;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #3d2c1e 0%, #5c3d28 100%);
    padding: 22px 32px 18px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(61,44,30,0.22);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-icon {
    font-size: 2.2rem;
    animation: wobble 3s ease-in-out infinite;
  }
  @keyframes wobble {
    0%,100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }
  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    color: var(--tan);
    letter-spacing: 0.5px;
    line-height: 1;
  }
  header h1 span { color: var(--lemon); }
  .header-sub {
    font-size: 0.7rem;
    color: var(--ink-muted);
    margin-top: 2px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .header-stats {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .stat-pill {
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    padding: 5px 14px;
    font-size: 0.72rem;
    color: var(--tan);
    font-weight: 700;
    letter-spacing: .3px;
  }
  .stat-pill span { color: var(--lemon); font-size: .85rem; }

  /* ── QUICK ADD ── */
  .quick-add {
    background: var(--tan-deep);
    border-bottom: 2px solid var(--tan-border);
    padding: 14px 32px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .quick-add input[type="text"] {
    flex: 1; min-width: 180px;
    border: 2px solid var(--tan-border);
    border-radius: 50px;
    padding: 10px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    background: var(--tan-card);
    color: var(--ink);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .quick-add input[type="text"]:focus {
    border-color: var(--sky);
    box-shadow: 0 0 0 3px rgba(74,184,232,0.15);
  }
  .quick-add input[type="text"]::placeholder { color: var(--ink-muted); font-weight: 400; }
  .quick-add select, .quick-add input[type="date"] {
    border: 2px solid var(--tan-border);
    border-radius: 50px;
    padding: 10px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--tan-card);
    color: var(--ink);
    outline: none;
    cursor: pointer;
    transition: border-color .2s;
  }
  .quick-add select:focus, .quick-add input[type="date"]:focus { border-color: var(--sky); }
  .btn {
    border: none;
    border-radius: 50px;
    padding: 10px 22px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform .12s, box-shadow .15s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.95); }
  .btn-primary {
    background: linear-gradient(135deg, var(--coral), #e8512a);
    color: #fff;
    box-shadow: 0 4px 12px rgba(244,114,74,0.35);
  }
  .btn-primary:hover { box-shadow: 0 6px 18px rgba(244,114,74,0.45); transform: translateY(-1px); }
  .btn-ghost {
    background: var(--tan-card);
    color: var(--ink-soft);
    border: 2px solid var(--tan-border);
  }
  .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* ── FILTER BAR ── */
  .filter-bar {
    background: var(--tan-card);
    border-bottom: 2px solid var(--tan-border);
    padding: 10px 32px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 6px 14px;
    border: 2px solid var(--tan-border);
    border-radius: 50px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: var(--ink-soft); color: var(--ink); }
  .filter-btn.active {
    background: var(--ink);
    color: var(--tan);
    border-color: var(--ink);
  }
  .filter-btn.f-high.active  { background: var(--coral);   border-color: var(--coral);   color: #fff; }
  .filter-btn.f-med.active   { background: #d4a800;        border-color: #d4a800;        color: #fff; }
  .filter-btn.f-low.active   { background: var(--mint);    border-color: var(--mint);    color: #fff; }
  .fsep { width: 1px; height: 20px; background: var(--tan-border); margin: 0 2px; }
  .search-wrap { margin-left: auto; }
  .search-wrap input {
    border: 2px solid var(--tan-border);
    border-radius: 50px;
    padding: 7px 16px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    background: var(--tan);
    color: var(--ink);
    outline: none;
    width: 160px;
    transition: border-color .2s, width .25s;
  }
  .search-wrap input:focus { border-color: var(--sky); width: 210px; }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    max-width: 1080px;
    margin: 0 auto;
    padding: 26px 32px;
    gap: 28px;
    align-items: flex-start;
  }

  /* ── LISTS PANEL ── */
  .lists-panel { width: 200px; flex-shrink: 0; }
  .panel-title {
    font-family: 'Fredoka One', cursive;
    font-size: 0.9rem;
    letter-spacing: .5px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .manage-btn {
    font-family: 'Nunito', sans-serif; font-size: 0.68rem; font-weight: 800;
    background: var(--tan-deep); border: 1.5px solid var(--tan-border);
    border-radius: 50px; padding: 2px 10px; cursor: pointer; color: var(--ink-soft);
    transition: all .15s; letter-spacing: .3px;
  }
  .manage-btn:hover, .manage-btn.active { background: var(--ink); color: var(--tan); border-color: var(--ink); }

  .list-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 700;
    transition: background .15s;
    margin-bottom: 3px;
    color: var(--ink-soft);
    position: relative;
  }
  .list-item:hover { background: var(--tan-deep); color: var(--ink); }
  .list-item.active { background: var(--ink); color: var(--tan); }
  .list-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-count {
    font-size: 0.68rem; font-weight: 800;
    background: rgba(0,0,0,.08); border-radius: 50px; padding: 1px 7px;
  }
  .list-item.active .list-count { background: rgba(255,255,255,.18); }

  /* delete button shown in manage mode */
  .list-del-btn {
    display: none;
    background: none; border: none; cursor: pointer;
    color: var(--ink-muted); font-size: 0.78rem; padding: 2px 4px;
    border-radius: 6px; line-height: 1; flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .list-del-btn:hover { background: #fde8de; color: var(--coral); }
  body.managing-areas .list-del-btn { display: flex; }
  body.managing-areas .list-count   { display: none; }
  body.managing-areas .list-item { cursor: default; }
  body.managing-areas .list-item:not(.no-delete):hover { background: var(--tan-deep); }

  /* add area form */
  .area-add-form {
    margin-top: 10px;
    background: var(--tan-card);
    border: 2px solid var(--tan-border);
    border-radius: 12px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 7px;
  }
  body.managing-areas .area-add-form { display: flex; }
  .area-add-form input[type="text"] {
    border: 1.5px solid var(--tan-border); border-radius: 8px;
    padding: 7px 10px;
    font-family: 'Nunito', sans-serif; font-size: 0.78rem; font-weight: 600;
    background: var(--tan); color: var(--ink); outline: none; width: 100%;
  }
  .area-add-form input[type="text"]:focus { border-color: var(--sky); }
  .emoji-row {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .emoji-opt {
    font-size: 1rem; padding: 3px 5px; border-radius: 7px; cursor: pointer;
    border: 2px solid transparent; transition: all .12s; line-height: 1.4;
  }
  .emoji-opt:hover { background: var(--tan-deep); }
  .emoji-opt.selected { border-color: var(--sky); background: rgba(74,184,232,.12); }
  .area-add-row { display: flex; gap: 6px; }
  .area-add-row button {
    flex: 1; border: none; border-radius: 8px; padding: 7px 0;
    font-family: 'Nunito', sans-serif; font-size: 0.78rem; font-weight: 800;
    cursor: pointer; transition: background .15s;
  }
  .area-save-btn { background: var(--ink); color: var(--tan); }
  .area-save-btn:hover { background: var(--coral); }
  .area-cancel-btn { background: var(--tan-deep); color: var(--ink-soft); border: 1.5px solid var(--tan-border) !important; }
  .area-cancel-btn:hover { color: var(--ink); }

  /* ── TASKS AREA ── */
  .tasks-area { flex: 1; min-width: 0; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-header h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .sort-select {
    border: 2px solid var(--tan-border); border-radius: 50px;
    padding: 6px 12px;
    font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 700;
    background: var(--tan-card); color: var(--ink-soft); outline: none; cursor: pointer;
  }

  /* ── TASK CARD ── */
  .task-card {
    background: var(--tan-card);
    border: 2px solid var(--tan-border);
    border-radius: var(--radius);
    padding: 14px 16px 14px 20px;
    margin-bottom: 10px;
    display: flex; gap: 12px; align-items: flex-start;
    transition: box-shadow .2s, transform .15s;
    animation: popIn .2s cubic-bezier(.34,1.56,.64,1);
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    border-radius: 12px 0 0 12px;
    background: var(--tan-border);
  }
  .p-high.task-card::before  { background: var(--coral); }
  .p-med.task-card::before   { background: var(--lemon); }
  .p-low.task-card::before   { background: var(--mint); }

  @keyframes popIn {
    from { opacity: 0; transform: scale(.94) translateY(-6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .task-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .task-card.done { opacity: .55; }
  .task-card.done .task-title { text-decoration: line-through; color: var(--ink-muted); }
  .task-card.overdue:not(.done) { border-color: var(--coral); }

  .drag-handle {
    color: var(--tan-border); cursor: grab; font-size: 1rem; padding-top: 2px;
    opacity: 0; transition: opacity .15s; user-select: none;
  }
  .task-card:hover .drag-handle { opacity: 1; color: var(--ink-muted); }

  .task-check {
    width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px;
    border: 2.5px solid var(--tan-border); border-radius: 50%;
    cursor: pointer; transition: all .18s;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
  }
  .task-check:hover { border-color: var(--mint); background: rgba(82,201,138,.12); }
  .task-card.done .task-check { background: var(--mint); border-color: var(--mint); color: #fff; }
  .task-check::after { content: ''; }
  .task-card.done .task-check::after { content: '✓'; font-weight: 900; }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 0.92rem; font-weight: 800; line-height: 1.4; word-break: break-word; }
  .task-title[contenteditable="true"] { outline: none; border-bottom: 2px dashed var(--sky); cursor: text; }
  .task-desc { font-size: 0.76rem; color: var(--ink-muted); margin-top: 3px; line-height: 1.55; word-break: break-word; font-weight: 600; white-space: pre-line; }
  .task-desc[contenteditable="true"] { outline: none; border-bottom: 1.5px dashed var(--tan-border); cursor: text; }

  .task-meta { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; align-items: center; }

  .priority-tag {
    font-size: 0.67rem; font-weight: 800;
    padding: 3px 10px; border-radius: 50px; letter-spacing: .4px;
  }
  .priority-tag.high { background: #fde8de; color: #c0410a; }
  .priority-tag.med  { background: #fef9c3; color: #92680a; }
  .priority-tag.low  { background: #dcfce7; color: #166534; }

  .due-pill {
    font-size: 0.67rem; font-weight: 700;
    padding: 3px 10px; border-radius: 50px;
    background: var(--tan-deep); color: var(--ink-soft);
    display: flex; align-items: center; gap: 3px;
  }
  .due-pill.overdue { background: #fde8de; color: var(--coral); }
  .due-pill.today   { background: #fef9c3; color: #92680a; }

  .tag-pill {
    font-size: 0.67rem; font-weight: 700;
    padding: 3px 10px; border-radius: 50px;
    background: var(--tan-deep); color: var(--ink-soft);
  }
  /* category color tags */
  .tag-pill[data-cat="gameplay"]  { background: #e0f2fe; color: #0369a1; }
  .tag-pill[data-cat="art"]       { background: #fce7f3; color: #be185d; }
  .tag-pill[data-cat="audio"]     { background: #f3e8ff; color: #7e22ce; }
  .tag-pill[data-cat="ui"]        { background: #ecfdf5; color: #065f46; }
  .tag-pill[data-cat="bug"]       { background: #fee2e2; color: #b91c1c; }
  .tag-pill[data-cat="writing"]   { background: #fefce8; color: #854d0e; }

  .recurring-pill {
    font-size: 0.67rem; font-weight: 700;
    padding: 3px 10px; border-radius: 50px;
    background: #f0fdf4; color: #166534;
  }

  .task-actions {
    display: flex; gap: 3px; flex-shrink: 0; opacity: 0; transition: opacity .15s;
  }
  .task-card:hover .task-actions { opacity: 1; }
  .action-btn {
    background: none; border: none; cursor: pointer;
    font-size: 0.88rem; padding: 4px 6px; border-radius: 8px;
    transition: background .15s;
  }
  .action-btn:hover { background: var(--tan-deep); }
  .action-btn.del:hover { background: #fde8de; }

  /* subtasks */
  .subtasks { margin-top: 10px; border-top: 1.5px solid var(--tan-border); padding-top: 8px; }
  .subtask-row { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); padding: 3px 0; }
  .subtask-check {
    width: 14px; height: 14px; border: 2px solid var(--tan-border); border-radius: 4px;
    cursor: pointer; flex-shrink: 0; transition: all .15s;
    display: flex; align-items: center; justify-content: center; font-size: .55rem;
  }
  .subtask-check:hover { border-color: var(--mint); }
  .subtask-check.done { background: var(--mint); border-color: var(--mint); color: #fff; }
  .subtask-check.done::after { content: '✓'; font-weight: 900; }
  .subtask-label { flex: 1; }
  .subtask-label.done { text-decoration: line-through; color: var(--ink-muted); }
  .subtask-del { background: none; border: none; color: var(--tan-border); cursor: pointer; font-size: .72rem; opacity: 0; transition: opacity .15s; }
  .subtask-row:hover .subtask-del { opacity: 1; }
  .subtask-del:hover { color: var(--coral); }
  .subtask-add { display: flex; gap: 6px; margin-top: 6px; }
  .subtask-add input {
    flex: 1; border: 1.5px solid var(--tan-border); border-radius: 8px;
    padding: 5px 10px;
    font-family: 'Nunito', sans-serif; font-size: 0.73rem; font-weight: 600;
    background: var(--tan); color: var(--ink); outline: none;
  }
  .subtask-add button {
    background: var(--tan-border); border: none; border-radius: 8px; padding: 5px 12px;
    font-size: 0.73rem; font-weight: 800; cursor: pointer; color: var(--ink); transition: background .15s;
  }
  .subtask-add button:hover { background: var(--mint); color: #fff; }

  /* ── COMPLETED SECTION ── */
  .completed-section { margin-top: 28px; }
  .completed-toggle {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 0.8rem; letter-spacing: .3px;
    color: var(--ink-soft); cursor: pointer; user-select: none; margin-bottom: 10px;
    background: none; border: none; padding: 0;
  }
  .completed-toggle:hover { color: var(--ink); }

  /* empty */
  .empty {
    text-align: center; padding: 48px 24px;
    color: var(--ink-muted); font-size: 0.85rem; font-weight: 700;
  }
  .empty .empty-icon { font-size: 3rem; margin-bottom: 12px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(61,44,30,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; animation: fadeIn .15s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--tan-card);
    border-radius: 20px;
    padding: 30px;
    width: 92%; max-width: 480px;
    box-shadow: 0 24px 60px rgba(61,44,30,.28);
    animation: popIn .2s cubic-bezier(.34,1.56,.64,1);
    border: 2px solid var(--tan-border);
  }
  .modal h3 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem; margin-bottom: 18px; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .modal label {
    display: block; font-size: 0.7rem; font-weight: 800;
    letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: 5px; margin-top: 14px;
  }
  .modal input, .modal select, .modal textarea {
    width: 100%; border: 2px solid var(--tan-border); border-radius: 10px;
    padding: 9px 13px;
    font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 600;
    background: var(--tan); color: var(--ink); outline: none;
    transition: border-color .2s;
  }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--sky); }
  .modal textarea { resize: vertical; min-height: 72px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end; }
  .tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .tag-chip {
    background: var(--tan-deep); border: 1.5px solid var(--tan-border); border-radius: 50px;
    padding: 4px 11px; font-size: 0.73rem; font-weight: 700;
    display: flex; align-items: center; gap: 5px; color: var(--ink-soft);
  }
  .tag-chip button { background: none; border: none; cursor: pointer; color: var(--ink-muted); font-size: .72rem; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--tan);
    padding: 11px 22px; border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 0.8rem; font-weight: 700;
    display: flex; gap: 14px; align-items: center;
    z-index: 300; animation: slideUp .2s ease;
    box-shadow: 0 8px 24px rgba(61,44,30,.28);
  }
  @keyframes slideUp {
    from { transform: translateX(-50%) translateY(20px); opacity: 0; }
    to   { transform: translateX(-50%) translateY(0); opacity: 1; }
  }
  .toast button {
    background: var(--coral); border: none; color: #fff;
    border-radius: 50px; padding: 4px 13px;
    font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 800; cursor: pointer;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--tan-border); border-radius: 4px; }

  @media (max-width: 640px) {
    .layout { padding: 14px 16px; flex-direction: column; }
    .lists-panel { width: 100%; }
    header, .quick-add, .filter-bar { padding-left: 16px; padding-right: 16px; }
    .search-wrap { margin-left: 0; width: 100%; }
    .search-wrap input { width: 100%; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="logo-icon">🐾</div>
    <div>
      <h1>Petro<span>polis</span></h1>
      <div class="header-sub">Dev Board</div>
    </div>
  </div>
  <div class="header-stats" id="stats"></div>
</header>

<!-- QUICK ADD -->
<div class="quick-add">
  <input type="text" id="quickTitle" placeholder="New task… (Enter to add)" />
  <select id="quickPriority">
    <option value="none">— Priority</option>
    <option value="high">🔴 Critical</option>
    <option value="med">🟡 Medium</option>
    <option value="low">🟢 Low</option>
  </select>
  <input type="date" id="quickDue" />

<!-- FILTER BAR -->
<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="today">Today</button>
  <button class="filter-btn" data-filter="upcoming">Upcoming</button>
  <button class="filter-btn" data-filter="overdue">🚨 Overdue</button>
  <div class="fsep"></div>
  <button class="filter-btn f-high" data-filter="high">🔴 Critical</button>
  <button class="filter-btn f-med"  data-filter="med">🟡 Medium</button>
  <button class="filter-btn f-low"  data-filter="low">🟢 Low</button>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 Search tasks…" />
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <!-- LISTS -->
  <div class="lists-panel">
    <div class="panel-title">
      <span>🗂 Areas</span>
      <button class="manage-btn" id="manageAreasBtn">Manage</button>
    </div>
    <div id="listItems"></div>
    <div class="area-add-form" id="areaAddForm">
      <input type="text" id="newListInput" placeholder="Area name…" />
      <div class="emoji-row" id="emojiPicker"></div>
      <div class="area-add-row">
        <button class="area-cancel-btn" id="areaCancelBtn">Cancel</button>
        <button class="area-save-btn" id="addListBtn">Add Area</button>
      </div>
    </div>
  </div>

  <!-- TASKS -->
  <div class="tasks-area">
    <div class="section-header">
      <h2 id="viewTitle">🐱 All Tasks</h2>
      <select class="sort-select" id="sortSelect">
        <option value="manual">Manual order</option>
        <option value="due">By due date</option>
        <option value="priority">By priority</option>
        <option value="alpha">Alphabetical</option>
        <option value="created">Date added</option>

    <div id="taskList"></div>
    <div class="completed-section">
      <button class="completed-toggle" id="completedToggle">▶ Completed (<span id="completedCount">0</span>)</button>

<!-- MODAL -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <h3 id="modalTitle">🐾 New Task</h3>

    <input type="text" id="mTitle" placeholder="What needs to be done?" />

<script>
// ── DEFAULT BACKLOG (from context/todo.md) ──
function getDefaultBacklogTasks() {
  const row = (num, title, goal, criteria, opt = {}) => ({
    id: 'bl-' + num,
    title: num + ' — ' + title,
    desc: 'Goal: ' + goal + (opt.notes ? '\n\nNotes: ' + opt.notes : ''),
    priority: opt.priority || 'med',
    due: '',
    list: opt.list || 'gameplay',
    tags: opt.tags || [],
    subtasks: criteria.map(label => ({ label, done: false })),
    recurring: 'none',
    done: false,
    created: Date.now() - (20 - parseInt(num, 10)) * 1200,
  });
  return [
    row('01', 'Pet stats UI — polish',
      'Primary and secondary pet stats are easy to read at a glance, match the game’s visual direction, and feel finished (spacing, typography, icons or bars, feedback).',
      [
        'HUD shows primary stats (Hunger, Health, Happiness, Energy) with clear labels and current values (numeric and/or bar).',
        'Secondary stats (Cleanliness, Attachment, Runaway Risk) are reachable from one obvious control (e.g. menu button or collapsible panel) without cluttering the main HUD.',
        'Stat changes are visible within ~1s of the underlying value changing (bar tween, flash, or short pulse — not silent updates).',
        'Layout works at the project’s target resolution(s); no overlapping text or clipped controls in normal play.',
        'Colors/icons distinguish stat types; critical thresholds (e.g. low health) use a distinct visual treatment.',
      ], { list: 'ui', priority: 'low', tags: ['ui'], notes: 'Align with “General UI & HUD” and Phase 3 pet stats in roadmap.md.' }),
    row('02', 'Pet stats — decay over time',
      'Stats drift when the player is not actively caring for the pet, so neglect has consequences.',
      [
        'Passive tick applies to relevant stats (per design: e.g. Hunger increases, Energy decreases over in-game time) at defined rates.',
        'Decay/gain is deterministic or seeded consistently (no random drift unless specified).',
        'Rates are configurable (constants, ScriptableObject, or inspector fields) without code edits for tuning.',
        'Decay respects pause / menu state if the game should freeze simulation while paused (define behavior and implement consistently).',
        'PetStatsManager (or equivalent) owns tick logic; no duplicate competing timers.',
      ], { priority: 'high', tags: ['gameplay'], notes: 'Roadmap already mentions passive ticks; this item is “fully wired and tunable.”' }),
    row('03', 'Game over / pet death when stats are critically low',
      'Extreme neglect or harm ends the run with a clear failure state.',
      [
        'Documented thresholds per stat (or composite rule) that trigger failure (exact rules explicit in code/data).',
        'On trigger: gameplay input stops or transitions to a dedicated Game Over flow; pet cannot recover without restart/load.',
        'Player sees a clear message explaining why the run ended (which condition fired).',
        'Session end hooks fire (e.g. session report, save flags) same as quit where applicable.',
        'No soft-lock: UI remains navigable (retry / main menu / quit).',
      ], { priority: 'high', tags: ['gameplay'], notes: 'Coordinate with runaway events if both exist; avoid two conflicting “lose” systems.' }),
    row('04', 'Areas — non-default zone effects',
      'Entering a zone changes stat or economy behavior beyond a single global default.',
      [
        'Each major zone (Home, Parks, Vet, Groomer, Grocery, Bank, jobs, etc.) has an explicit effect profile (data or script): which stats are influenced, direction, and magnitude or curve.',
        '“Base” behavior is defined once; zones override or add to base (documented: additive vs multiplicative).',
        'Enter/exit or dwell-time rules are consistent (e.g. on trigger enter, on interact, or timed while inside).',
        'Effects are testable in isolation (debug toggle or unit-style test for at least one zone).',
      ], { priority: 'high', tags: ['gameplay'], notes: 'Extends Phase 2 zone triggers + Phase 4 interactions.' }),
    row('05', 'Special areas — full functionality',
      'Zones that are not “walk and passive buff” have real interactions (UI, costs, outcomes).',
      [
        'List of “special” zones is explicit (e.g. Bank, stores, job sites, Vet, Groomer).',
        'Each special zone: player can complete at least one meaningful loop (open UI → action → state change → feedback).',
        'Costs, inventory, and pet stats update correctly after each action; failures (insufficient funds) are communicated.',
        'Zone-specific rules from the roadmap are implemented or explicitly deferred with a ticket.',
      ], { priority: 'high', tags: ['gameplay'], notes: 'Overlaps grocery/vet/groomer/bank/job flows; criteria here are “no empty shells.”' }),
    row('06', 'NPCs — exclude player’s chosen character',
      'World-populating NPCs never use the same head/body combo (or same identity) as the player’s current character.',
      [
        'On spawn or pool fetch, NPC appearance is chosen from a set that excludes the player’s selected head/body indices (or equivalent IDs).',
        'If the pool is exhausted (small asset set), behavior is defined — no silent duplicate with player.',
        'Changing character mid-session (if supported) updates the exclusion list for new spawns.',
      ], { list: 'art', tags: ['art'] }),
    row('07', 'NPCs — spawn inside buildings',
      'NPCs appear at plausible indoor anchor points, not only outdoors.',
      [
        'Defined spawn points or volumes per building/interior (Transforms, spawn volumes, or tile data).',
        'NPCs instantiated at those points do not intersect geometry (basic ground/placement validation or hand-placed safe points).',
        'Spawn density or count rules exist (max per building, cooldown) to avoid clutter.',
        'Entering/exiting buildings does not duplicate or orphan NPCs (cleanup or persistent world rules documented).',
      ], { list: 'art', tags: ['art'] }),
    row('08', 'NPCs — animation',
      'Non-player characters play idle/walk (and any required) animation states so the world feels alive.',
      [
        'NPCs use an Animator (or equivalent) with at least idle and locomotion states when moving.',
        'Movement speed matches animation parameters (no sliding feet beyond acceptable threshold).',
        'When NPC is stationary, idle plays; when pathing, walk/move plays.',
        'Performance: reasonable upper bound on simultaneous animated NPCs for target hardware (pooling or limits if needed).',
      ], { list: 'art', priority: 'low', tags: ['art'] }),
    row('09', 'Pet actions',
      'The pet can perform discrete actions (eat, play, tricks, react) tied to stats, context, or player command.',
      [
        'At least N concrete actions implemented (define N ≥ 3: e.g. feed from inventory, play at park, respond to pet).',
        'Each action has: trigger condition, animation or VFX hook, effect on one or more stats, and failure feedback if conditions not met.',
        'Actions are listed in UI or discoverable (tutorial prompt or action menu) — not hidden debug-only.',
        'Cooldowns or limits exist if needed to prevent stat exploits.',
      ], { tags: ['gameplay'], notes: 'Overlaps pet leveling XP sources; keep one source of truth for what grants XP.' }),
    row('10', 'Pet levels',
      'Pet gains XP, levels up, and progression is visible and rewarding.',
      [
        'XP sources defined (which actions grant how much); data-driven preferred.',
        'Level-up thresholds table or curve exists; level cannot decrease unless by design.',
        'UI shows current level and progress toward next level (bar or numeric).',
        'Level-up event fires: notification, optional stat bonus or unlock, logged for session report.',
        'Max level behavior defined (cap XP, prestige, or flat rewards).',
      ], { tags: ['gameplay'], notes: 'Matches Phase 3 “Pet leveling” in roadmap.' }),
    row('11', 'Achievements',
      'Optional goals reward exploration and care; state persists across sessions if the game persists saves.',
      [
        'Achievement definitions live in data (id, title, description, unlock condition).',
        'Unlocking shows in-game feedback (toast, modal, or HUD badge).',
        'Progress achievements track partial completion where applicable.',
        'Save/load or PlayerPrefs stores unlocked set; new game resets appropriately.',
        'At least one achievement per category you care about (economy, pet care, zones, story) — minimum set agreed with design.',
      ], { tags: ['gameplay'] }),
    row('12', 'Notifications — on area enter',
      'Entering a zone gives contextual, non-spammy feedback.',
      [
        'First enter per session (or per in-game day) can show a short line of context / zone flavor text.',
        'Repeat visits: either no toast, or a quieter rule (cooldown per zone).',
        'Does not stack multiple full-screen blockers; compatible with walking gameplay.',
        'Localizable strings if project uses localization pipeline.',
      ], { list: 'ui', priority: 'low', tags: ['ui'] }),
    row('13', 'Alerts — important events',
      'Critical situations (low stats, runaway risk, unpaid loan, job deadline) reach the player clearly.',
      [
        'List of alert conditions is explicit in code/data (e.g. Hunger above threshold, Runaway Risk above X%).',
        'Each alert has severity (info / warning / critical) and channel (HUD icon, modal, sound — per design).',
        'Cooldowns or deduplication prevent the same alert every frame.',
        'Player can acknowledge or dismiss where appropriate without losing the underlying problem (state remains until fixed).',
      ], { priority: 'high', list: 'ui', tags: ['ui'], notes: 'Roadmap mentions critical stat alerts; align with Phase 4.' }),
    row('14', 'Buy items from store',
      'Grocery (and similar) shop: browse, pay, receive items into inventory.',
      [
        'Item catalog with base prices and names displayed in UI.',
        'Purchase deducts currency atomically (no double-spend on rapid clicks).',
        'Insufficient funds blocks purchase with clear message.',
        'Inventory updates; pet consumables can be used from inventory per feeding flow.',
        'Purchases feed economy/session tracking for reports.',
      ], { priority: 'high', tags: ['gameplay'], notes: 'Vet/groomer as “services” can share the same payment pattern with different effect hooks.' }),
    row('15', 'OpenAI API — store negotiation',
      'Store owner chat negotiates price; agreed price applies to the current transaction; graceful degradation without API.',
      [
        'API key loaded from secure config (not hardcoded); errors handled.',
        'Chat UI: history, input, send, close; system prompt defines merchant persona and inventory/base prices.',
        'Parsed outcome updates transaction price (or rejects invalid parses with fallback).',
        'Fallback to base price if API fails, times out, or returns unusable content.',
        'Rate limiting / user feedback on wait states (spinner, disabled send).',
      ], { tags: ['gameplay'], notes: 'Matches Phase 6 roadmap; hook per store zone as specified there.' }),
    row('16', 'Loans — principal, interest, repayment',
      'Player can borrow, accrues interest over in-game time, and repayment is enforced or has consequences.',
      [
        'Loan offer UI: principal, interest rate, term or minimum payment rules, total due over time shown before confirm.',
        'Balance and interest accrue on a defined schedule (per in-game day/week).',
        'Payments reduce principal/interest correctly; early repayment behavior defined.',
        'Default/missed payment: defined consequence — must be implemented, not “TBD” in code.',
        'Loan state appears in HUD/bank UI and in session report summary.',
      ], { tags: ['gameplay'], notes: 'Roadmap lists optional loan; this checklist treats it as full feature when tackled.' }),
    row('17', 'Session report — actions, prices, chat, etc.',
      'End-of-session artifact includes rich detail: actions, economic breakdown, negotiation/chat logs, and pet progression.',
      [
        'Report file (JSON/CSV per roadmap) includes: timestamped action list, money in/out with categories, balance snapshots.',
        'Per purchase: item/service id, base price, final price, negotiation flag.',
        'Store chat transcripts or summarized negotiation outcomes (privacy: no API keys in file).',
        'Pet: final stats, level, XP, notable events (level-ups, runaway warnings).',
        'File naming includes session end timestamp; format documented for parsers.',
      ], { tags: ['gameplay'], notes: 'Aligns with Phase 8 SessionTracker scope.' }),
    row('18', 'Pause menu — in game',
      'Player can pause, adjust options or return to menu without corrupting simulation state.',
      [
        'Single dedicated input opens pause from gameplay (and closes or stacks consistently with other UIs).',
        'While paused: game simulation stops or audio/UI behavior matches documented design (pick one and implement consistently).',
        'Resume returns to gameplay with correct state; no duplicate pause menus.',
        'Entries: Resume, Options (if exists), Return to main menu / Quit — actual set matches project menu flow.',
        'Pause is suppressed where inappropriate (e.g. main menu, loading) if applicable.',
      ], { priority: 'high', list: 'ui', tags: ['ui'] }),
    row('19', 'Consistent UI',
      'Fonts, colors, button styles, panels, and navigation patterns are unified across HUD, shops, bank, pause, and character/pet setup.',
      [
        'Shared UI prefab or style sheet (Unity UI Toolkit theme, prefab variants, or documented color/spacing tokens).',
        'Primary/secondary text styles reused; no one-off fonts per screen without reason.',
        'Buttons, sliders, and lists share hover/disabled visuals.',
        'Modal vs toast vs HUD layering order documented and consistent (no shop under pause accidentally).',
        'Short style guide in repo optional; in-product consistency is the acceptance bar.',
      ], { list: 'ui', priority: 'low', tags: ['ui'] }),
    row('20', 'codeflow.html — add code snippets',
      'Populate codeflow.html with a substantial set of illustrative snippets from the Petropolis-States codebase so flows and systems are easy to walk through in the CodeFlow presentation tool.',
      [
        'Add snippets covering the main areas you want documented (e.g. pet stats, zones, economy, UI, session/report) — aim for breadth, not one-off samples.',
        'Each snippet is tied to real project paths or clearly labeled as pseudo/example when illustrative only.',
        'Slides/sections in codeflow.html stay organized (headings, order matches architecture or user journey).',
        'Syntax/theme remains readable; long snippets are split or summarized with a “see file” note where needed.',
        'Quick pass: open codeflow.html in a browser and confirm navigation and snippet display work end-to-end.',
      ], { list: 'writing', priority: 'med', tags: ['writing', 'ui'], notes: 'Target file: codeflow.html at repo root.' }),
  ];
}

function loadTasksFromStorage() {
  try {
    const raw = localStorage.getItem('petropolis_tasks');
    if (raw != null) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return { tasks: parsed, seeded: false };
    }
  } catch (e) {}
  return { tasks: getDefaultBacklogTasks(), seeded: true };
}

// ── STATE ──
const _loaded = loadTasksFromStorage();
let tasks = _loaded.tasks;
let lists = JSON.parse(localStorage.getItem('petropolis_lists') || JSON.stringify([
  { id: 'gameplay',  name: 'Gameplay',   color: '#4ab8e8', emoji: '🎮' },
  { id: 'art',       name: 'Art & UI',   color: '#f472b6', emoji: '🎨' },
  { id: 'audio',     name: 'Audio',      color: '#b07fe8', emoji: '🎵' },
  { id: 'writing',   name: 'Writing',    color: '#f5c842', emoji: '✍️' },
  { id: 'bugs',      name: 'Bug Fixes',  color: '#f4724a', emoji: '🐛' },
  { id: 'release',   name: 'Release',    color: '#52c98a', emoji: '🚀' },
]));

let activeFilter = 'all';
let activeList = 'all';
let searchQ = '';
let sortBy = 'manual';
let editingTaskId = null;
let modalTags = [];
let undoStack = [];
let dragSrcId = null;

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);
const isPast    = d => d && d < todayStr();
const isToday   = d => d === todayStr();
const isFuture  = d => d && d > todayStr();

function save() {
  localStorage.setItem('petropolis_tasks', JSON.stringify(tasks));
  localStorage.setItem('petropolis_lists', JSON.stringify(lists));
}
if (_loaded.seeded) save();

// ── RENDER ──
function render() { renderLists(); renderStats(); renderTasks(); }

const listEmoji = { gameplay:'🎮', art:'🎨', audio:'🎵', writing:'✍️', bugs:'🐛', release:'🚀' };
const viewEmojis = { all:'🐱', today:'☀️', upcoming:'📅', overdue:'🚨', high:'🔴', med:'🟡', low:'🟢' };

function renderLists() {
  const el = document.getElementById('listItems');
  const countFor = id => tasks.filter(t => !t.done && (id === 'all' ? true : t.list === id)).length;
  const allLists = [{ id: 'all', name: 'All Areas', color: '#3d2c1e', emoji: '🐾' }, ...lists];
  el.innerHTML = allLists.map(l => `
    <div class="list-item ${activeList === l.id ? 'active' : ''} ${l.id === 'all' ? 'no-delete' : ''}" data-lid="${l.id}">
      <span>${l.emoji || '📁'}</span>
      <span class="list-name">${l.name}</span>
      <span class="list-count">${countFor(l.id)}</span>
      ${l.id !== 'all' ? `<button class="list-del-btn" data-dellist="${l.id}" title="Remove area">✕</button>` : ''}
    </div>
  `).join('');
  el.querySelectorAll('.list-item').forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.closest('.list-del-btn')) return;
      if (managingAreas) return;
      activeList = item.dataset.lid;
      const found = lists.find(l => l.id === activeList);
      const emoji = activeList === 'all' ? '🐱' : (found?.emoji || '📁');
      const name  = activeList === 'all' ? 'All Tasks' : (found?.name || 'Tasks');
      document.getElementById('viewTitle').innerHTML = `${emoji} ${name}`;
      render();
    });
  });
  el.querySelectorAll('.list-del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.dellist;
      const listName = lists.find(l => l.id === id)?.name || 'area';
      const taskCount = tasks.filter(t => t.list === id).length;
      const msg = taskCount > 0
        ? `Remove "${listName}"? Its ${taskCount} task(s) will move to the first area.`
        : `Remove "${listName}"?`;
      if (!confirm(msg)) return;
      // move tasks to first remaining list
      const fallback = lists.find(l => l.id !== id)?.id || '';
      tasks.forEach(t => { if (t.list === id) t.list = fallback; });
      lists = lists.filter(l => l.id !== id);
      if (activeList === id) activeList = 'all';
      save(); render();
    });
  });
  const mList = document.getElementById('mList');
  mList.innerHTML = lists.map(l => `<option value="${l.id}">${l.emoji || ''} ${l.name}</option>`).join('');
}

function renderStats() {
  const total = tasks.length;
  const done  = tasks.filter(t => t.done).length;
  const overdue = tasks.filter(t => isPast(t.due) && !t.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('stats').innerHTML = `
    <div class="stat-pill"><span>${done}/${total}</span> done</div>
    <div class="stat-pill"><span>${pct}%</span> complete</div>
    ${overdue ? `<div class="stat-pill" style="border-color:rgba(244,114,74,.4)"><span style="color:var(--coral)">${overdue}</span> overdue</div>` : ''}
  `;
}

function filterTasks() {
  let list = tasks.filter(t => {
    if (activeList !== 'all' && t.list !== activeList) return false;
    if (searchQ) {
      const q = searchQ.toLowerCase();
      return t.title.toLowerCase().includes(q) ||
        (t.desc || '').toLowerCase().includes(q) ||
        (t.tags || []).some(tag => tag.toLowerCase().includes(q));
    }
    return true;
  });
  switch (activeFilter) {
    case 'today':    list = list.filter(t => isToday(t.due)); break;
    case 'upcoming': list = list.filter(t => isFuture(t.due)); break;
    case 'overdue':  list = list.filter(t => isPast(t.due) && !t.done); break;
    case 'high':     list = list.filter(t => t.priority === 'high'); break;
    case 'med':      list = list.filter(t => t.priority === 'med'); break;
    case 'low':      list = list.filter(t => t.priority === 'low'); break;
  }
  return list;
}

function sortTasks(list) {
  const po = { high:0, med:1, low:2, none:3 };
  switch (sortBy) {
    case 'due':      return [...list].sort((a,b) => (a.due||'zzzz').localeCompare(b.due||'zzzz'));
    case 'priority': return [...list].sort((a,b) => (po[a.priority]||3) - (po[b.priority]||3));
    case 'alpha':    return [...list].sort((a,b) => a.title.localeCompare(b.title));
    case 'created':  return [...list].sort((a,b) => b.created - a.created);
    default: return list;
  }
}

function renderTasks() {
  const all    = filterTasks();
  const active = sortTasks(all.filter(t => !t.done));
  const done   = all.filter(t => t.done);
  document.getElementById('completedCount').textContent = done.length;

  const tl = document.getElementById('taskList');
  const cl = document.getElementById('completedList');
  tl.innerHTML = active.length ? active.map(taskHTML).join('') :
    `<div class="empty"><div class="empty-icon">🐾</div>Nothing here — add your first task!</div>`;
  cl.innerHTML = done.length ? done.map(taskHTML).join('') :
    `<div class="empty" style="padding:12px 0;font-size:.78rem">No completed tasks yet.</div>`;

  bindEvents(tl);
  bindEvents(cl);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${mo[+m-1]} ${+day}${new Date().getFullYear()!=+y?', '+y:''}`;
}

const GAME_CATS = ['gameplay','art','audio','ui','bug','writing'];

function taskHTML(t) {
  const overdue = isPast(t.due) && !t.done;
  const todayDue = isToday(t.due);
  const pMap = { high:'Critical', med:'Medium', low:'Low' };
  const rMap = { daily:'↻ Daily', weekly:'↻ Weekly', monthly:'↻ Monthly' };

  const subtasksHTML = `
    <div class="subtasks">
      ${(t.subtasks||[]).map((s,i) => `
        <div class="subtask-row">
          <div class="subtask-check ${s.done?'done':''}" data-stid="${t.id}" data-sti="${i}"></div>
          <span class="subtask-label ${s.done?'done':''}">${esc(s.label)}</span>
          <button class="subtask-del" data-stdelete="${t.id}" data-sti="${i}">✕</button>
        </div>
      `).join('')}
      <div class="subtask-add">
        <input type="text" placeholder="Add subtask…" data-stinput="${t.id}" />
        <button data-stadd="${t.id}">Add</button>
      </div>
    </div>
  `;

  return `
    <div class="task-card p-${t.priority||'none'} ${t.done?'done':''} ${overdue?'overdue':''}"
         data-id="${t.id}" draggable="true">
      <div class="drag-handle">⠿</div>
      <div class="task-check" data-toggle="${t.id}"></div>
      <div class="task-body">
        <div class="task-title" data-edittitle="${t.id}">${esc(t.title)}</div>
        <div class="task-desc" data-editdesc="${t.id}">${t.desc ? esc(t.desc) : '<span style="opacity:.4;font-weight:400;font-size:.72rem">Double-click to add notes…</span>'}</div>
        <div class="task-meta">
          ${t.priority && t.priority!=='none' ? `<span class="priority-tag ${t.priority}">${pMap[t.priority]}</span>` : ''}
          ${t.due ? `<span class="due-pill ${overdue?'overdue':todayDue?'today':''}">📅 ${formatDate(t.due)}${overdue?' (overdue)':todayDue?' (today)':''}</span>` : ''}
          ${(t.tags||[]).map(tag => `<span class="tag-pill" data-cat="${GAME_CATS.includes(tag)?tag:''}">#${esc(tag)}</span>`).join('')}
          ${t.recurring && t.recurring!=='none' ? `<span class="recurring-pill">${rMap[t.recurring]}</span>` : ''}
        </div>
        ${subtasksHTML}
      </div>
      <div class="task-actions">
        <button class="action-btn" data-edit="${t.id}" title="Edit">✏️</button>
        <button class="action-btn del" data-delete="${t.id}" title="Delete">🗑</button>
      </div>
    </div>
  `;
}

function bindEvents(container) {
  container.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const t = tasks.find(t => t.id === el.dataset.toggle);
      if (t) { t.done = !t.done; save(); render(); }
    });
  });
  container.querySelectorAll('[data-delete]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.delete;
      const t  = tasks.find(t => t.id === id);
      undoStack.push({ type:'delete', task:{...t}, index: tasks.indexOf(t) });
      tasks = tasks.filter(t => t.id !== id);
      save(); render(); showToast(`Deleted "${t.title}"`, true);
    });
  });
  container.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', () => openModal(el.dataset.edit));
  });
  container.querySelectorAll('[data-edittitle]').forEach(el => {
    el.addEventListener('dblclick', () => {
      el.contentEditable = 'true'; el.focus();
      el.addEventListener('blur', () => {
        const t = tasks.find(t => t.id === el.dataset.edittitle);
        if (t) { t.title = el.textContent.trim() || t.title; save(); render(); }
        el.contentEditable = 'false';
      }, { once: true });
    });
  });
  container.querySelectorAll('[data-editdesc]').forEach(el => {
    el.addEventListener('dblclick', () => {
      el.contentEditable = 'true'; el.focus();
      el.addEventListener('blur', () => {
        const t = tasks.find(t => t.id === el.dataset.editdesc);
        if (t) { t.desc = el.textContent.trim(); save(); render(); }
        el.contentEditable = 'false';
      }, { once: true });
    });
  });
  container.querySelectorAll('[data-stid]').forEach(el => {
    el.addEventListener('click', () => {
      const t = tasks.find(t => t.id === el.dataset.stid);
      if (t) { t.subtasks[+el.dataset.sti].done = !t.subtasks[+el.dataset.sti].done; save(); render(); }
    });
  });
  container.querySelectorAll('[data-stdelete]').forEach(el => {
    el.addEventListener('click', () => {
      const t = tasks.find(t => t.id === el.dataset.stdelete);
      if (t) { t.subtasks.splice(+el.dataset.sti, 1); save(); render(); }
    });
  });
  container.querySelectorAll('[data-stadd]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.stadd;
      const inp = container.querySelector(`[data-stinput="${id}"]`);
      const val = inp.value.trim(); if (!val) return;
      const t = tasks.find(t => t.id === id);
      if (t) { if (!t.subtasks) t.subtasks = []; t.subtasks.push({ label:val, done:false }); save(); render(); }
    });
  });
  container.querySelectorAll('[data-stinput]').forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') container.querySelector(`[data-stadd="${inp.dataset.stinput}"]`)?.click();
    });
  });
  // drag & drop
  container.querySelectorAll('.task-card').forEach(card => {
    card.addEventListener('dragstart', () => { dragSrcId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend',   () => { card.classList.remove('dragging'); dragSrcId = null; });
    card.addEventListener('dragover',  e => { e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault(); card.classList.remove('drag-over');
      if (!dragSrcId || dragSrcId === card.dataset.id) return;
      const si = tasks.findIndex(t => t.id === dragSrcId);
      const ti = tasks.findIndex(t => t.id === card.dataset.id);
      const [moved] = tasks.splice(si, 1);
      tasks.splice(ti, 0, moved);
      save(); render();
    });
  });
}

// ── QUICK ADD ──
function quickAdd() {
  const title = document.getElementById('quickTitle').value.trim();
  if (!title) return;
  tasks.unshift({
    id: uid(), title,
    desc: '',
    priority: document.getElementById('quickPriority').value,
    due: document.getElementById('quickDue').value || '',
    list: activeList !== 'all' ? activeList : lists[0]?.id || '',
    tags: [], subtasks: [], recurring: 'none',
    done: false, created: Date.now(),
  });
  save(); render();
  document.getElementById('quickTitle').value = '';
  document.getElementById('quickPriority').value = 'none';
  document.getElementById('quickDue').value = '';
}
document.getElementById('addBtn').addEventListener('click', quickAdd);
document.getElementById('quickTitle').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(); });

// ── MODAL ──
function openModal(id = null) {
  editingTaskId = id; modalTags = [];
  const t = id ? tasks.find(t => t.id === id) : null;
  document.getElementById('modalTitle').innerHTML = id ? '✏️ Edit Task' : '🐾 New Task';
  document.getElementById('mTitle').value     = t?.title || '';
  document.getElementById('mDesc').value      = t?.desc  || '';
  document.getElementById('mDue').value       = t?.due   || '';
  document.getElementById('mPriority').value  = t?.priority  || 'none';
  document.getElementById('mList').value      = t?.list      || lists[0]?.id || '';
  document.getElementById('mRecurring').value = t?.recurring || 'none';
  modalTags = [...(t?.tags || [])];
  document.getElementById('mTagInput').value = '';
  renderModalTags();
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('mTitle').focus(), 80);
}
function renderModalTags() {
  document.getElementById('mTagsDisplay').innerHTML = modalTags.map((tag, i) => `
    <div class="tag-chip">#${esc(tag)}<button data-tagidx="${i}">✕</button></div>
  `).join('');
  document.getElementById('mTagsDisplay').querySelectorAll('[data-tagidx]').forEach(btn => {
    btn.addEventListener('click', () => { modalTags.splice(+btn.dataset.tagidx, 1); renderModalTags(); });
  });
}
document.getElementById('mTagInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/^#/, '').toLowerCase();
    if (val && !modalTags.includes(val)) { modalTags.push(val); renderModalTags(); }
    e.target.value = '';
  }
});
document.getElementById('advancedBtn').addEventListener('click', () => openModal(null));
document.getElementById('modalCancel').addEventListener('click', () => { document.getElementById('modal').style.display = 'none'; });
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) document.getElementById('modal').style.display = 'none';
});
document.getElementById('modalSave').addEventListener('click', () => {
  const title = document.getElementById('mTitle').value.trim();
  if (!title) { document.getElementById('mTitle').style.borderColor = 'var(--coral)'; return; }
  const data = {
    title, desc: document.getElementById('mDesc').value,
    due: document.getElementById('mDue').value,
    priority: document.getElementById('mPriority').value,
    list: document.getElementById('mList').value,
    recurring: document.getElementById('mRecurring').value,
    tags: [...modalTags],
  };
  if (editingTaskId) {
    Object.assign(tasks.find(t => t.id === editingTaskId), data);
  } else {
    tasks.unshift({ id: uid(), ...data, subtasks:[], done:false, created:Date.now() });
  }
  save(); render();
  document.getElementById('modal').style.display = 'none';
});

// ── FILTERS ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    const emoji = viewEmojis[activeFilter] || '🐱';
    const labels = { all:'All Tasks', today:'Today', upcoming:'Upcoming', overdue:'Overdue', high:'Critical', med:'Medium', low:'Low Priority' };
    if (activeList === 'all') document.getElementById('viewTitle').innerHTML = `${emoji} ${labels[activeFilter]||'Tasks'}`;
    render();
  });
});

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input', e => { searchQ = e.target.value; render(); });

// ── SORT ──
document.getElementById('sortSelect').addEventListener('change', e => { sortBy = e.target.value; render(); });

// ── COMPLETED TOGGLE ──
document.getElementById('completedToggle').addEventListener('click', () => {
  const cl = document.getElementById('completedList');
  const open = cl.style.display !== 'none';
  cl.style.display = open ? 'none' : 'block';
  document.getElementById('completedToggle').innerHTML =
    `${open?'▶':'▼'} Completed (<span id="completedCount">${document.getElementById('completedCount').textContent}</span>)`;
});

// ── AREAS MANAGE MODE ──
const EMOJIS = ['🎮','🎨','🎵','✍️','🐛','🚀','🏙️','🐾','🐱','🐶','⭐','💡','🔧','📋','🌿','🏆','💬','🗺️','🧪','📦'];
let selectedEmoji = '📁';
let managingAreas = false;

function renderEmojiPicker() {
  document.getElementById('emojiPicker').innerHTML = EMOJIS.map(e =>
    `<div class="emoji-opt ${e === selectedEmoji ? 'selected' : ''}" data-emoji="${e}">${e}</div>`
  ).join('');
  document.getElementById('emojiPicker').querySelectorAll('.emoji-opt').forEach(el => {
    el.addEventListener('click', () => {
      selectedEmoji = el.dataset.emoji;
      renderEmojiPicker();
    });
  });
}

document.getElementById('manageAreasBtn').addEventListener('click', () => {
  managingAreas = !managingAreas;
  document.body.classList.toggle('managing-areas', managingAreas);
  document.getElementById('manageAreasBtn').classList.toggle('active', managingAreas);
  document.getElementById('manageAreasBtn').textContent = managingAreas ? 'Done' : 'Manage';
  if (managingAreas) { selectedEmoji = '📁'; renderEmojiPicker(); }
  render();
});

document.getElementById('areaCancelBtn').addEventListener('click', () => {
  document.getElementById('newListInput').value = '';
  selectedEmoji = '📁'; renderEmojiPicker();
});

document.getElementById('addListBtn').addEventListener('click', () => {
  const val = document.getElementById('newListInput').value.trim(); if (!val) return;
  const colors = ['#4ab8e8','#f472b6','#b07fe8','#f5c842','#52c98a','#f4724a'];
  lists.push({ id: uid(), name: val, color: colors[lists.length % colors.length], emoji: selectedEmoji });
  save(); render();
  document.getElementById('newListInput').value = '';
  selectedEmoji = '📁'; renderEmojiPicker();
});
document.getElementById('newListInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addListBtn').click();
});

// ── TOAST / UNDO ──
let toastTimer;
function showToast(msg, canUndo = false) {
  clearTimeout(toastTimer);
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${msg}</span>${canUndo ? '<button id="undoBtn">Undo</button>' : ''}`;
  document.body.appendChild(el);
  if (canUndo) {
    el.querySelector('#undoBtn').addEventListener('click', () => {
      const a = undoStack.pop();
      if (a?.type === 'delete') { tasks.splice(a.index, 0, a.task); save(); render(); }
      el.remove();
    });
  }
  toastTimer = setTimeout(() => el.remove(), 4000);
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
    const a = undoStack.pop();
    if (a?.type === 'delete') { tasks.splice(a.index, 0, a.task); save(); render(); }
  }
  if (e.key === 'Escape') document.getElementById('modal').style.display = 'none';
  if (e.key === 'n' && !e.metaKey && !e.ctrlKey &&
      document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    document.getElementById('quickTitle').focus();
  }
});

render();
</script>
