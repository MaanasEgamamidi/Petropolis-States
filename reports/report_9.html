<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Report — March 29, 2026, 3:44:16 PM</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f4f4;
    color: #333;
    max-width: 960px;
    margin: 36px auto;
    padding: 0 24px;
    line-height: 1.5;
  }
  h1 {
    font-size: 1.35em;
    font-weight: 600;
    border-bottom: 2px solid #d0d0d0;
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .report-ts {
    margin: 0 0 22px 0;
    color: #666;
    font-size: 0.95em;
  }
  h2 {
    font-size: 1.05em;
    font-weight: 600;
    margin-top: 26px;
    margin-bottom: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin-bottom: 18px;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #e0e0e0;
  }
  th, td {
    text-align: left;
    padding: 8px 14px;
    border-bottom: 1px solid #eee;
  }
  tr:last-child th, tr:last-child td { border-bottom: none; }
  th {
    font-weight: 600;
    width: 42%;
    color: #555;
  }
  .net {
    color: #2a7d2a;
    font-weight: 600;
  }
  .chart-wrap {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    padding: 16px 18px 10px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Session Report</h1>
<p class="report-ts">March 29, 2026, 3:44:16 PM</p>

<h2>Player Info</h2>
<table>
  <tr><th>Player Name</th><td>Jignesh</td></tr>
  <tr><th>Pet Name</th><td>Max</td></tr>
  <tr><th>Session Length</th><td>4.3 in-game days</td></tr>
</table>

<h2>Money Summary</h2>
<table>
  <tr><th>Starting Amount</th><td>$150.00</td></tr>
  <tr><th>Ending Amount</th><td>$350.00</td></tr>
  <tr><th>Net Change</th><td class="net">+$200.00</td></tr>
  <tr><th>Highest Reached</th><td>$350.00</td></tr>
  <tr><th>Lowest Reached</th><td>$150.00</td></tr>
</table>

<h2>Money Over Time</h2>
<div class="chart-wrap">
  <canvas id="chart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
(function() {
  var startHour = 0;
  var showDays = true;
  var data = [{x:0,y:150.00},{x:7,y:150.00},{x:8,y:150.00},{x:9,y:150.00},{x:10,y:150.00},{x:11,y:150.00},{x:12,y:150.00},{x:13,y:150.00},{x:14,y:150.00},{x:15,y:150.00},{x:16,y:150.00},{x:17,y:150.00},{x:18,y:150.00},{x:19,y:150.00},{x:20,y:150.00},{x:21,y:150.00},{x:22,y:150.00},{x:23,y:150.00},{x:24,y:150.00},{x:25,y:150.00},{x:26,y:150.00},{x:27,y:150.00},{x:28,y:150.00},{x:29,y:150.00},{x:30,y:200.00},{x:31,y:200.00},{x:32,y:200.00},{x:33,y:200.00},{x:34,y:200.00},{x:35,y:200.00},{x:36,y:200.00},{x:37,y:200.00},{x:38,y:200.00},{x:39,y:200.00},{x:40,y:200.00},{x:41,y:200.00},{x:42,y:200.00},{x:43,y:200.00},{x:44,y:200.00},{x:45,y:200.00},{x:46,y:200.00},{x:47,y:200.00},{x:48,y:200.00},{x:49,y:200.00},{x:50,y:200.00},{x:51,y:200.00},{x:52,y:200.00},{x:53,y:200.00},{x:54,y:250.00},{x:55,y:250.00},{x:56,y:250.00},{x:57,y:250.00},{x:58,y:250.00},{x:59,y:250.00},{x:60,y:250.00},{x:61,y:250.00},{x:62,y:250.00},{x:63,y:250.00},{x:64,y:250.00},{x:65,y:250.00},{x:66,y:250.00},{x:67,y:250.00},{x:68,y:250.00},{x:69,y:250.00},{x:70,y:250.00},{x:71,y:250.00},{x:72,y:250.00},{x:73,y:250.00},{x:74,y:250.00},{x:75,y:250.00},{x:76,y:250.00},{x:77,y:250.00},{x:78,y:300.00},{x:79,y:300.00},{x:80,y:300.00},{x:81,y:300.00},{x:82,y:300.00},{x:83,y:300.00},{x:84,y:300.00},{x:85,y:300.00},{x:86,y:300.00},{x:87,y:300.00},{x:88,y:300.00},{x:89,y:300.00},{x:90,y:300.00},{x:91,y:300.00},{x:92,y:300.00},{x:93,y:300.00},{x:94,y:300.00},{x:95,y:300.00},{x:96,y:300.00},{x:97,y:300.00},{x:98,y:300.00},{x:99,y:300.00},{x:100,y:300.00},{x:101,y:300.00},{x:102,y:350.00},{x:102,y:350.00}];

  function fmtHour(cumH) {
    var hod = ((startHour + cumH) % 24 + 24) % 24;
    var h12 = hod % 12 === 0 ? 12 : Math.floor(hod) % 12;
    var p = Math.floor(hod) < 12 ? 'AM' : 'PM';
    return h12 + ' ' + p;
  }

  function dayNum(cumH) {
    return Math.floor((startHour + cumH) / 24) + 1;
  }

  var maxCum = data.length > 0 ? data[data.length - 1].x : 0;

  var firstAligned = (3 - (startHour % 3)) % 3;
  if (firstAligned > maxCum) firstAligned = 0;

  var ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [{
        data: data,
        fill: {
          target: 'origin',
          above: 'rgba(80,160,90,0.06)',
          below: 'rgba(180,60,60,0.06)'
        },
        tension: 0.2,
        pointRadius: 3.5,
        pointBackgroundColor: '#4a7c59',
        pointBorderColor: '#fff',
        pointBorderWidth: 1.5,
        pointHoverRadius: 6,
        pointHoverBackgroundColor: '#333',
        borderWidth: 2.5,
        segment: {
          borderColor: function(c) {
            var y0 = c.p0.parsed.y, y1 = c.p1.parsed.y;
            if (y1 > y0) return '#3a9d4a';
            if (y1 < y0) return '#c44';
            return '#999';
          }
        }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      aspectRatio: 2.8,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#333',
          titleFont: { size: 12 },
          bodyFont: { size: 12 },
          padding: 8,
          cornerRadius: 4,
          callbacks: {
            title: function(items) {
              if (!items.length) return '';
              return fmtHour(items[0].parsed.x) + (showDays ? ' — Day ' + dayNum(items[0].parsed.x) : '');
            },
            label: function(item) {
              return '  $' + item.parsed.y.toFixed(2);
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          title: { display: false },
          grid: {
            color: 'rgba(0,0,0,0.06)',
            drawTicks: true,
            tickLength: 6
          },
          border: { color: '#ccc' },
          ticks: {
            maxRotation: 0,
            autoSkip: false,
            color: '#666',
            font: { size: 11 },
            callback: function(val) {
              var hod = ((startHour + val) % 24 + 24) % 24;
              var onThree = Math.abs(hod - Math.round(hod / 3) * 3) < 0.01;
              if (!onThree) return '';
              var label = fmtHour(val);
              if (showDays) {
                var atMidnight = Math.abs(hod) < 0.01 || Math.abs(hod - 24) < 0.01;
                var isFirst = Math.abs(val) < 0.01;
                if (atMidnight || isFirst) {
                  return [label, 'Day ' + dayNum(val)];
                }
              }
              return label;
            },
            stepSize: 1
          },
          afterBuildTicks: function(axis) {
            var ticks = [];
            for (var t = firstAligned; t <= maxCum + 0.5; t += 3) {
              ticks.push({ value: t });
            }
            axis.ticks = ticks;
          }
        },
        y: {
          title: {
            display: true,
            text: 'Money ($)',
            color: '#777',
            font: { size: 12 }
          },
          grid: {
            color: 'rgba(0,0,0,0.06)'
          },
          border: { color: '#ccc' },
          ticks: {
            color: '#666',
            font: { size: 11 },
            callback: function(val) { return '$' + val; }
          },
          beginAtZero: true
        }
      }
    }
  });
})();
</script>
</body>
</html>
